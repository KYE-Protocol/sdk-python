[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kye-protocol"
version = "0.1.0a1"
description = "Official Python SDK for KYE Protocol™ — the Entity Authority Protocol for AI Governance. Public-vocabulary surface today; full runtime client at v1.0 GA."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "KYE Protocol" }]
requires-python = ">=3.10"
keywords = [
  "kye-protocol",
  "kye",
  "authority-finality",
  "ai-governance",
  "ai-agent",
  "delegation",
  "open-banking",
  "psd3",
  "eu-ai-act",
  "agentic-commerce",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.urls]
Homepage      = "https://kye-protocol.github.io/"
Documentation = "https://kye-protocol.github.io/concepts.html"
Repository    = "https://github.com/KYE-Protocol/sdk-python"
Issues        = "https://github.com/KYE-Protocol/sdk-python/issues"
Changelog     = "https://kye-protocol.github.io/changelog.html"

[tool.hatch.build.targets.wheel]
packages = ["src/kye_protocol"]
